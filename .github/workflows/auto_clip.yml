name: 1. Prepare 12 Clips & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Live Stream ya Video ka Link dalein'
        required: true
        type: string

permissions:
  contents: write

jobs:
  clip-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Layer 2 Shield - Cloudflare WARP IP Bypass
        run: echo "" | base64 -d | bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Layer 1 Shield - Direct YouTube PO-Token & EJS Engine
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg nodejs npm
          pip install -U "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider instagrapi pillow "moviepy<2.0"
          pip install -r requirements.txt
          echo "Z2l0IGNsb25lIC0tc2luZ2xlLWJyYW5jaCAtLWJyYW5jaCAxLjIuMiBodHRwczovL2dpdGh1Yi5jb20vQnJhaW5pY2lzbS9iZ3V0aWwteXRkbHAtcG90LXByb3ZpZGVyLmdpdCAvdG1wL3BvdApjZCAvdG1wL3BvdC9zZXJ2ZXIgJiYgbnBtIGluc3RhbGwgJiYgbnB4IHRzYyAmJiBub2h1cCBub2RlIGJ1aWxkL21haW4uanMgPiAvdG1wL3BvdC5sb2cgMj4mMSAmCnNsZWVwIDQK" | base64 -d | bash

      - name: Generate Clips & Send to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: python -u main.py

      - name: Save Clips to Cloud Storage for Later Selection
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-clips
          files: final_clips/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Instagram Session Fresh
        if: always()
        run: |
          if [ -f "ig_session.json" ]; then
            git config user.name "AutoClipper Bot"
            git config user.email "autoclipper@gmail.com"
            git add ig_session.json
            git commit -m "Refresh IG session" || true
            git push || true
          fi
