name: One-Link Auto Clipper & Uploader

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video ka Link yahan paste karein'
        required: true
        type: string

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Bypass YouTube IP Block (Cloudflare WARP)
        uses: AymanBagabas/setup-cloudflare-warp@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Deno (For yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg & Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade "yt-dlp[default]"
          pip install -r requirements.txt

      - name: Run Auto Clipper & Uploader
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          VIDEO_URL: ${{ github.event.inputs.youtube_url }}
        run: python main.py
