name: One-Link Auto Clipper & Uploader

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video ka Link yahan paste karein'
        required: true
        type: string

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js (For yt-dlp JS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg & Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp
          pip install -r requirements.txt

      - name: Run Auto Clipper & Uploader
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          VIDEO_URL: ${{ github.event.inputs.youtube_url }}
        run: python main.py
