name: 2. Upload Selected Clips to YouTube & Instagram

on:
  workflow_dispatch:
    inputs:
      selected_numbers:
        description: 'Jo clips upload karni hain unke number likhein (jaise: 2, 5, 9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-selected:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Bypass IP Block (Cloudflare WARP)
        run: echo "" | base64 -d | bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Upload Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-oauthlib requests instagrapi pillow "moviepy<2.0"

      - name: Download Saved Clips from Cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p final_clips
          gh release download latest-clips -D final_clips

      - name: Upload Selected Clips
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          SELECTED_NUMBERS: ${{ github.event.inputs.selected_numbers }}
        run: python -u upload.py

      - name: Keep Instagram Session Fresh
        run: |
          if [ -f "ig_session.json" ]; then
            git config user.name "AutoClipper Bot"
            git config user.email "autoclipper@gmail.com"
            git add ig_session.json
            git commit -m "Refresh IG session" || true
            git push || true
          fi
